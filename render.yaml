services:
- type: web
  name: next-js
  runtime: node
  plan: free
  buildCommand: yarn; npx prisma migrate deploy; yarn build
  startCommand: yarn start
  autoDeploy: false
  envVars:
  - key: NODE_ENV
    value: production
  # Dashboard-managed (not committed here) — set manually in the Render
  # dashboard. Previously undeclared entirely, so a fresh deploy from this
  # file alone booted straight into a runtime auth/DB failure with no
  # indication these were even needed.
  - key: DATABASE_URL
    sync: false
  - key: NEXTAUTH_SECRET
    sync: false
  - key: NEXTAUTH_URL
    sync: false
  - key: RESEND_API_KEY
    sync: false
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Daily purge of Trash items soft-deleted more than 60 days ago (see
# src/server/trash/service.ts, src/app/api/cron/purge-trash/route.ts). CRON_SECRET
# must match the same env var configured on the `next-js` web service above, and
# APP_URL must point at that service's deployed URL — set both manually in the
# Render dashboard (not committed here). Existing /api/cron/effects has no
# equivalent `type: cron` block in this file either, so however that one is
# triggered today (Render dashboard cron job or an external pinger), replicate
# the same mechanism for this one.
- type: cron
  name: purge-trash
  runtime: node
  plan: free
  schedule: "0 3 * * *"
  buildCommand: "true"
  startCommand: curl -sf -X POST -H "x-cron-secret:$CRON_SECRET" "$APP_URL/api/cron/purge-trash"
  envVars:
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Retry/crash backstop for background export jobs (see
# src/server/export/engine.ts, src/app/api/cron/exports/route.ts). Most
# exports complete via the un-awaited kick-off fired at enqueue time; this
# sweep only picks up jobs that failed, or a RUNNING job whose process died
# mid-generation. Runs every minute — cheap no-op when nothing is queued.
- type: cron
  name: exports-sweep
  runtime: node
  plan: free
  schedule: "* * * * *"
  buildCommand: "true"
  startCommand: curl -sf -X POST -H "x-cron-secret:$CRON_SECRET" "$APP_URL/api/cron/exports"
  envVars:
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
