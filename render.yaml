services:
- type: web
  name: next-js
  runtime: node
  plan: free
  buildCommand: yarn; npx prisma migrate deploy; yarn build
  startCommand: yarn start
  autoDeploy: false
  envVars:
  - key: NODE_ENV
    value: production
  # Dashboard-managed (not committed here) — set manually in the Render
  # dashboard. Previously undeclared entirely, so a fresh deploy from this
  # file alone booted straight into a runtime auth/DB failure with no
  # indication these were even needed.
  - key: DATABASE_URL
    sync: false
  - key: NEXTAUTH_SECRET
    sync: false
  - key: NEXTAUTH_URL
    sync: false
  - key: RESEND_API_KEY
    sync: false
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Daily purge of Trash items soft-deleted more than 60 days ago (see
# src/server/trash/service.ts, src/app/api/cron/purge-trash/route.ts). CRON_SECRET
# must match the same env var configured on the `next-js` web service above, and
# APP_URL must point at that service's deployed URL — set both manually in the
# Render dashboard (not committed here). Existing /api/cron/effects has no
# equivalent `type: cron` block in this file either, so however that one is
# triggered today (Render dashboard cron job or an external pinger), replicate
# the same mechanism for this one.
- type: cron
  name: purge-trash
  runtime: node
  plan: free
  schedule: "0 3 * * *"
  buildCommand: "true"
  startCommand: curl -sf -X POST -H "x-cron-secret:$CRON_SECRET" "$APP_URL/api/cron/purge-trash"
  envVars:
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Retry/crash backstop for background export jobs (see
# src/server/export/engine.ts, src/app/api/cron/exports/route.ts). Most
# exports complete via the un-awaited kick-off fired at enqueue time; this
# sweep only picks up jobs that failed, or a RUNNING job whose process died
# mid-generation. Runs every minute — cheap no-op when nothing is queued.
- type: cron
  name: exports-sweep
  runtime: node
  plan: free
  schedule: "* * * * *"
  buildCommand: "true"
  startCommand: curl -sf -X POST -H "x-cron-secret:$CRON_SECRET" "$APP_URL/api/cron/exports"
  envVars:
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Drains registration and campaign email outbox work. Campaign sends are
# idempotent and atomically claimed, so overlapping/restarted invocations are
# safe. This is the continuation mechanism for campaigns larger than one run.
- type: cron
  name: email-effects-sweep
  runtime: node
  plan: free
  schedule: "* * * * *"
  buildCommand: "true"
  startCommand: curl -sf -X POST -H "x-cron-secret:$CRON_SECRET" "$APP_URL/api/cron/effects"
  envVars:
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Drains the leaderboard's SCORE_* SideEffect outbox (see
# src/server/leaderboard/queue.ts, src/app/api/cron/score/route.ts) — the
# at-most-once half of automatic scan scoring. Runs every minute, same
# cadence as exports-sweep; deliberately a separate queue/route so a burst of
# QR scans can't starve email/PDF delivery, and vice versa.
- type: cron
  name: leaderboard-score-drain
  runtime: node
  plan: free
  schedule: "* * * * *"
  buildCommand: "true"
  startCommand: curl -sf -X POST -H "x-cron-secret:$CRON_SECRET" "$APP_URL/api/cron/score"
  envVars:
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Nightly full LeaderboardStat rebuild from ScoreEvent (see
# src/server/leaderboard/reconcile.ts, src/app/api/cron/score-reconcile/route.ts)
# — the healing half of at-most-once scan scoring. This is load-bearing, not
# just a drift-corrector: it's the only thing that ever catches a SideEffect
# insert lost to a mid-transaction crash. Runs once a day, off-peak.
- type: cron
  name: leaderboard-score-reconcile
  runtime: node
  plan: free
  schedule: "30 2 * * *"
  buildCommand: "true"
  startCommand: curl -sf -X POST -H "x-cron-secret:$CRON_SECRET" "$APP_URL/api/cron/score-reconcile"
  envVars:
  - key: CRON_SECRET
    sync: false
  - key: APP_URL
    sync: false
# Uncomment the following to deploy this app as a static site on render
